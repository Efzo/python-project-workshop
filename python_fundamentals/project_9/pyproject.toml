[build-system]
requires = ["setuptools>=80.9"]
build-backend = "setuptools.build_meta"

[project]
name = "learning-taskboard"
version = "1.0.0"
description = "A local task board for the Python project curriculum"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
taskboard = "taskboard.cli:main"

[tool.setuptools.packages.find]
include = ["taskboard"]
